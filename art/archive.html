<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive — Miha Presker</title>
  <link rel="stylesheet" href="/art/art.css?v=2">
  <script src="/theme.js?v=2"></script>
  <script src="/i18n-nav.js?v=2"></script>
  <script>
    Object.assign(window.PRESKER_I18N.en, {
      archiveAll: 'All', archiveSketch: 'Sketches', archiveModel: 'Models', archivePhoto: 'Photos',
      archiveDrawing: 'Drawings', archiveVideo: 'Video', archivePlan: 'Floor Plans',
      archivePrototype: 'Prototypes', archiveRejected: 'Rejected Concepts',
      archiveItem1Title: 'Formication — development sketch',
      archiveItem3Title: 'Spatial model',
      archiveTypeSketch: 'sketch', archiveTypePhoto: 'photo', archiveTypeModel: 'model',
    });
    Object.assign(window.PRESKER_I18N.de, {
      archiveAll: 'Alle', archiveSketch: 'Skizzen', archiveModel: 'Modelle', archivePhoto: 'Fotos',
      archiveDrawing: 'Zeichnungen', archiveVideo: 'Video', archivePlan: 'Grundrisse',
      archivePrototype: 'Prototypen', archiveRejected: 'Verworfene Konzepte',
      archiveItem1Title: 'Formication — Entwicklungsskizze',
      archiveItem3Title: 'Raummodell',
      archiveTypeSketch: 'Skizze', archiveTypePhoto: 'Foto', archiveTypeModel: 'Modell',
    });
    Object.assign(window.PRESKER_I18N.sl, {
      archiveAll: 'Vse', archiveSketch: 'Skice', archiveModel: 'Modeli', archivePhoto: 'Fotografije',
      archiveDrawing: 'Risbe', archiveVideo: 'Video', archivePlan: 'Tlorisi',
      archivePrototype: 'Prototipi', archiveRejected: 'Zavrnjeni koncepti',
      archiveItem1Title: 'Formication — razvojna skica',
      archiveItem3Title: 'Prostorski model',
      archiveTypeSketch: 'skica', archiveTypePhoto: 'fotografija', archiveTypeModel: 'model',
    });
  </script>
  <script src="/i18n.js?v=2"></script>
</head>
<body>
  <div class="top-bar"></div>
  <div class="art-shell">
    <nav class="art-nav" id="art-nav"></nav>
    <main class="art-main">

      <div class="page-header">
        <div class="page-eyebrow">Miha Presker</div>
        <h1 class="page-title" data-i18n="artArchive">Archive</h1>
      </div>

      <div class="archive-filters">
        <button class="filter-btn active" onclick="filter(this,'all')" data-i18n="archiveAll">All</button>
        <button class="filter-btn" onclick="filter(this,'sketch')" data-i18n="archiveSketch">Sketches</button>
        <button class="filter-btn" onclick="filter(this,'model')" data-i18n="archiveModel">Models</button>
        <button class="filter-btn" onclick="filter(this,'photo')" data-i18n="archivePhoto">Photos</button>
        <button class="filter-btn" onclick="filter(this,'drawing')" data-i18n="archiveDrawing">Drawings</button>
        <button class="filter-btn" onclick="filter(this,'video')" data-i18n="archiveVideo">Video</button>
        <button class="filter-btn" onclick="filter(this,'plan')" data-i18n="archivePlan">Floor Plans</button>
        <button class="filter-btn" onclick="filter(this,'prototype')" data-i18n="archivePrototype">Prototypes</button>
        <button class="filter-btn" onclick="filter(this,'rejected')" data-i18n="archiveRejected">Rejected Concepts</button>
      </div>

      <!-- Archive grid — add items following this pattern -->
      <div class="archive-grid" id="archive-grid">

        <div class="archive-item" data-type="sketch">
          <div class="archive-item-img">
            <img src="/art/images/archive/sketch-01.jpg" alt="Sketch" onerror="this.parentElement.style.background='var(--bg3)'">
          </div>
          <div class="archive-item-info">
            <div class="archive-item-title" data-i18n="archiveItem1Title">Formication — development sketch</div>
            <div class="archive-item-meta">2006 · <span data-i18n="archiveTypeSketch">sketch</span></div>
          </div>
        </div>

        <div class="archive-item" data-type="photo">
          <div class="archive-item-img">
            <img src="/art/images/archive/studio-01.jpg" alt="Studio" onerror="this.parentElement.style.background='var(--bg3)'">
          </div>
          <div class="archive-item-info">
            <div class="archive-item-title">ISCP Studio, New York</div>
            <div class="archive-item-meta">2008 · <span data-i18n="archiveTypePhoto">photo</span></div>
          </div>
        </div>

        <div class="archive-item" data-type="model">
          <div class="archive-item-img">
            <img src="/art/images/archive/model-01.jpg" alt="Model" onerror="this.parentElement.style.background='var(--bg3)'">
          </div>
          <div class="archive-item-info">
            <div class="archive-item-title" data-i18n="archiveItem3Title">Spatial model</div>
            <div class="archive-item-meta" data-i18n="archiveTypeModel">model</div>
          </div>
        </div>

      </div>

          <div class="donate-mini">
        <a href="https://revolut.me/mihadxmro" target="_blank" rel="noopener" aria-label="Donate via Revolut"><img src="/images/revolut-qr.png" alt="Scan or tap to donate via Revolut" data-i18n-alt="alt034" class="donate-mini-qr" loading="lazy"></a>
        <div class="donate-mini-text">
          <p class="donate-mini-note" data-i18n="artDonateNote">Support this — everything here is free.</p>
          <a href="https://revolut.me/mihadxmro" target="_blank" rel="noopener" class="donate"><span class="r">R</span> Donate via Revolut</a>
        </div>
      </div>

</main>
  </div>
  <script src="/art/nav.js?v=2"></script>
  <script>
    function filter(btn, type) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.archive-item').forEach(item => {
        item.style.display = (type === 'all' || item.dataset.type === type) ? '' : 'none';
      });
    }
  </script>
</body>
</html>
