<!--
  Bit Blocks - the children's version of /lab/core-memory/.
    block          = a magnetic core: dark stone is 0, glowing gold is 1, it turns over to flip
    row of 8       = one byte = one letter, shown on the printer block at the end of the row
    water stream   = current on a drive wire; one stream is half strength, so only the block
                     where a row stream and a column stream cross gets enough to turn
    water direction = current polarity: forwards makes 1, backwards makes 0
    "look" + splash = destructive read with a sense pulse, followed by write-back
  One HTML file plus a self-hosted copy of three.js r178 (MIT, see vendor/three-LICENSE.txt).
  All textures are 16x16 pixel art drawn at start-up and shown with nearest-neighbour filtering.

// ---------------------------------------------------------------- pixel textures
const PX = 16;
function rng(seed) { return () => ((seed = Math.imul(seed ^ (seed >>> 15), 2246822507) + 0x9e3779b9 | 0) >>> 0) / 4294967296; }

  t.generateMipmaps = false;

}
const shade = (rgb, k) => `rgb(${rgb.map(v => Math.max(0, Math.min(255, Math.round(v * k)))).join(',')})`;

const GLYPH = {
  0: ['.###.', '#...#', '#..##', '#.#.#', '##..#', '#...#', '.###.'],
  1: ['..#..', '.##..', '..#..', '..#..', '..#..', '..#..', '.###.'],

function glyph(g, ch, color) { g.fillStyle = color; GLYPH[ch].forEach((row, y) => [...row].forEach((p, x) => { if (p === '#') g.fillRect(5 + x, 4 + y, 1, 1); })); }
const T_GRASS = tex((g, r) => { noise(g, r, [94, 157, 52], 0.16); }, 3);
const T_GRASS_SIDE = tex((g, r) => { noise(g, r, [134, 96, 67], 0.16); for (let x = 0; x < PX; x++) { const h = 3 + (r() < 0.4 ? 1 : 0); for (let y = 0; y < h; y++) { g.fillStyle = shade([94, 157, 52], 0.85 + r() * 0.3); g.fillRect(x, y, 1, 1); } } }, 4);
const T_DIRT = tex((g, r) => noise(g, r, [134, 96, 67], 0.18), 5);
const T_STONE0 = tex((g, r) => { noise(g, r, [92, 96, 104], 0.2); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, PX, 1); g.fillRect(0, 0, 1, PX); glyph(g, 0, '#1d2026'); }, 6);
const T_GOLD1 = tex((g, r) => { noise(g, r, [252, 205, 64], 0.14); g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(0, 0, PX, 1); g.fillRect(0, 0, 1, PX); g.fillStyle = 'rgba(150,90,0,.35)'; g.fillRect(0, PX - 1, PX, 1); g.fillRect(PX - 1, 0, 1, PX); glyph(g, 1, '#fff8d8'); }, 7);
const T_SIDE = tex((g, r) => noise(g, r, [70, 72, 78], 0.2), 8);
const T_PIPE = tex((g, r) => { noise(g, r, [150, 156, 164], 0.12); g.fillStyle = '#26303a'; g.fillRect(4, 4, 8, 8); g.fillStyle = '#3d6f9e'; g.fillRect(5, 5, 6, 6); }, 9);
const T_PIPE_ON = tex((g, r) => { noise(g, r, [150, 156, 164], 0.12); g.fillStyle = '#26303a'; g.fillRect(4, 4, 8, 8); g.fillStyle = '#4aa8ff'; g.fillRect(5, 5, 6, 6); g.fillStyle = '#bfe3ff'; g.fillRect(6, 6, 2, 2); }, 9);
const T_PIPE_SIDE = tex((g, r) => { noise(g, r, [150, 156, 164], 0.12); g.fillStyle = 'rgba(0,0,0,.25)'; for (let y = 3; y < PX; y += 5) g.fillRect(0, y, PX, 1); }, 10);
const T_WATER = tex((g, r) => { noise(g, r, [52, 120, 220], 0.12); g.fillStyle = 'rgba(200,230,255,.55)'; for (let i = 0; i < 7; i++) g.fillRect(Math.floor(r() * 12), Math.floor(r() * PX), 3 + Math.floor(r() * 3), 1); }, 11);
T_WATER.wrapS = T_WATER.wrapT = THREE.RepeatWrapping;
const T_PRINTER = tex((g, r) => { noise(g, r, [215, 214, 205], 0.08); g.fillStyle = '#333'; g.fillRect(2, 12, 12, 2); }, 12);
const charTex = new Map();
function letterTex(code) {
  const key = code;
  if (charTex.has(key)) return charTex.get(key);
  const S = 20, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#10241a'; g.fillRect(0, 0, S, S);
  const ch = code >= 32 && code < 127 ? String.fromCharCode(code) : (code === 0 ? '' : '?');
  const m = document.createElement('canvas'); m.width = m.height = S;
  const mg = m.getContext('2d'); mg.fillStyle = '#fff'; mg.font = 'bold 17px "Courier New", monospace'; mg.textAlign = 'center'; mg.textBaseline = 'middle';
  mg.fillText(ch, S / 2, S / 2 + 1);
  const d = mg.getImageData(0, 0, S, S).data;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if (d[(y * S + x) * 4 + 3] > 120) { g.fillStyle = '#ffd23f'; g.fillRect(x, y, 1, 1); }

// ---------------------------------------------------------------- scene
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ec9ff);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xdff1ff, 0x6b5a3a, 1.5));
const sunL = new THREE.DirectionalLight(0xffffff, 1.6);
sunL.position.set(-6, 14, 8); sunL.castShadow = true; sunL.shadow.mapSize.set(1024, 1024);
Object.assign(sunL.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
sunL.shadow.camera.updateProjectionMatrix();
scene.add(sunL);

const lam = (map, extra = {}) => new THREE.MeshLambertMaterial({ map, ...extra });
const M_GRASS = [lam(T_GRASS_SIDE), lam(T_GRASS_SIDE), lam(T_GRASS), lam(T_DIRT), lam(T_GRASS_SIDE), lam(T_GRASS_SIDE)];
const M_BIT = [lam(T_SIDE), lam(T_SIDE), lam(T_GOLD1, { emissive: 0x6a4a00, emissiveMap: T_GOLD1 }), lam(T_STONE0), lam(T_GOLD1, { emissive: 0x6a4a00, emissiveMap: T_GOLD1 }), lam(T_STONE0)];
const M_PIPE = lam(T_PIPE_SIDE), M_PIPE_END = lam(T_PIPE), M_PIPE_END_ON = lam(T_PIPE_ON, { emissive: 0x0a3050 });

const world = new THREE.Group(); scene.add(world);
const P = 1.12;                         // block pitch
const ROW_GAP = 1.5;                    // rows are spaced so the row streams have room
let R = 1, bits = [], blocks = [], rowPipes = [], colPipes = [], printers = [], ground = null;
const colX = c => (c - 3.5) * P;
const rowZ = r => (r - (R - 1) / 2) * ROW_GAP;
const PIPE_X = colX(0) - 1.6, PRINT_X = colX(7) + 1.75;
const backZ = () => rowZ(0) - 1.55;

function buildWorld() {
  world.clear(); blocks = []; rowPipes = []; colPipes = []; printers = [];
  // floating grass island
  const w = PRINT_X - PIPE_X + 2.4, d = (R - 1) * ROW_GAP + 4.2;
  const geo = new THREE.BoxGeometry(w, 1, d);
  const uvRepeat = (mat, rx, ry) => { const c = mat.map.clone(); c.wrapS = c.wrapT = THREE.RepeatWrapping; c.repeat.set(rx, ry); c.needsUpdate = true; return new THREE.MeshLambertMaterial({ map: c }); };
  ground = new THREE.Mesh(geo, [uvRepeat(M_GRASS[0], d, 1), uvRepeat(M_GRASS[1], d, 1), uvRepeat(M_GRASS[2], w, d), uvRepeat(M_GRASS[3], w, d), uvRepeat(M_GRASS[4], w, 1), uvRepeat(M_GRASS[5], w, 1)]);
  ground.position.set((PIPE_X + PRINT_X) / 2, -0.5, rowZ(0) - 0.55 + d / 2 - 1.55);
  ground.receiveShadow = true; world.add(ground);
  const under = new THREE.Mesh(new THREE.BoxGeometry(w - 2, 1, d - 2), uvRepeat(M_GRASS[3], w - 2, d - 2));
  under.position.copy(ground.position); under.position.y = -1.5; world.add(under);

  const boxGeo = new THREE.BoxGeometry(1, 1, 1);
  for (let r = 0; r < R; r++) {
    const row = [];
    for (let c = 0; c < 8; c++) {
      const holder = new THREE.Group(); holder.position.set(colX(c), 0.5, rowZ(r));
      const m = new THREE.Mesh(boxGeo, M_BIT); m.castShadow = m.receiveShadow = true;
      m.userData = { kind: 'bit', r, c };
      holder.add(m); world.add(holder);
      const ang = bits[r][c] ? 0 : Math.PI;
      m.rotation.x = ang;
      row.push({ holder, mesh: m, ang, target: ang, wob: 0, hop: 0 });
    }
    blocks.push(row);
    rowPipes.push(pipe(PIPE_X, rowZ(r), 'x', { kind: 'rowPipe', r }));
    printers.push(printer(PRINT_X, rowZ(r)));

  for (let c = 0; c < 8; c++) colPipes.push(pipe(colX(c), backZ(), 'z', { kind: 'colPipe', c }));

  for (const p of [...rowPipes, ...colPipes]) p.g.visible = showPipes;

}
function pipe(x, z, axis, data) {
  const g = new THREE.Group(); g.position.set(x, 0, z);

  const head = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.62, 0.62), [M_PIPE, M_PIPE, M_PIPE, M_PIPE, M_PIPE, M_PIPE]);

  head.material[endFace] = M_PIPE_END;
  for (const m of [post, head]) m.userData = data;

  return { g, head, endFace, axis };
}
function printer(x, z) {
  // a low, wide block with the letter on its top face, so it reads from the camera above
  const g = new THREE.Group(); g.position.set(x, 0, z);
  const pm = lam(T_PRINTER);
  const screen = lam(letterTex(0), { emissive: 0xffffff, emissiveMap: letterTex(0), emissiveIntensity: 0.8 });
  const box = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.7, 1.3), [pm, pm, screen, pm, screen, pm]);

  box.castShadow = true; g.add(box);
  world.add(g);

}
const byteOf = r => bits[r].reduce((v, b) => (v << 1) | b, 0);
const charOf = code => code >= 32 && code < 127 ? String.fromCharCode(code) : (code === 0 ? ' ' : '?');

}
function refreshPipes() {
  rowPipes.forEach((p, r) => { p.head.material[p.endFace] = r === sel.r ? M_PIPE_END_ON : M_PIPE_END; p.head.material = p.head.material.slice(); });
  colPipes.forEach((p, c) => { p.head.material[p.endFace] = c === sel.c ? M_PIPE_END_ON : M_PIPE_END; p.head.material = p.head.material.slice(); });
}

// clouds drifting by
const clouds = [];
for (let i = 0; i < 7; i++) {

    if (p.life <= 0) { world.remove(p.m); p.m.material.dispose(); parts.splice(i, 1); }
  }
  for (const cl of clouds) { cl.position.x += dt * 0.4; if (cl.position.x > 34) cl.position.x = -34; }
  if (mode === 'play') {
    clock += dt;
    if (!hintShown && level.hint && clock > 45 && li !== 3) { hintShown = true; showHint(); }
  }
  if (noteTimer > 0) { noteTimer -= dt; if (noteTimer <= 0) setNote(''); }
  const d = camBase.dist * zoom;
  camera.position.set(camBase.look.x + Math.sin(camAz) * Math.cos(camEl) * d, camBase.look.y + Math.sin(camEl) * d, camBase.look.z + Math.cos(camAz) * Math.cos(camEl) * d);
  camera.lookAt(camBase.look);
  renderer.render(scene, camera);
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight;
  // on wide screens, centre the island in the space right of the panel
  const off = innerWidth > 760 ? Math.min(190, innerWidth * 0.2) : 0;
  if (off) camera.setViewOffset(innerWidth, innerHeight, -off, 0, innerWidth, innerHeight); else camera.clearViewOffset();
  camera.updateProjectionMatrix(); fitCamera();
}
addEventListener('resize', resize);

// ---------------------------------------------------------------- chrome
for (const b of document.querySelectorAll('[data-lang]')) b.addEventListener('click', () => {
  lang = b.dataset.lang; try { localStorage.setItem('bit-blocks-lang', lang); } catch (_) {}
  // buildDock too: the dock is already drawn behind the intro modal, so without
  // it the reset button and the tip keep the previous language.
  if (mode === 'intro') { renderHud(); buildDock(); showIntro(); } else startLevel(li, false);
});
document.getElementById('lnkGrown').addEventListener('click', e => { e.preventDefault(); showGrown(); });
document.getElementById('btnCollapse').addEventListener('click', () => { const m = document.getElementById('hud').classList.toggle('min'); document.getElementById('btnCollapse').textContent = m ? '+' : '–'; });
const sb = document.getElementById('btnSound');
const paintSound = () => (sb.textContent = soundOn ? '🔊' : '🔇');
paintSound();
sb.addEventListener('click', () => { soundOn = !soundOn; try { localStorage.setItem('bit-blocks-sound', soundOn ? 'on' : 'off'); } catch (_) {} paintSound(); });

window.__bb = { startLevel, sel, get bits() { return bits; }, get mode() { return mode; }, pourWater, lookAll, putBack, writeWord, refreshPipes,
  setDir: v => (dirFwd = v), advance: sec => { for (let i = 0; i < sec * 60; i++) update(1 / 60); }, tap: (r, c) => { const b = blocks[r][c]; bits[r][c] ^= 1; b.target += Math.PI; refreshPrinters(); afterChange(); }, busy };

resize();
startLevel(0, false);
showIntro();
requestAnimationFrame(frame);
</script>
