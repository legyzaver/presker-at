    1. viewpoint   - an anamorphic painting that only resolves from one spot
    2. light       - additive colour and coloured shadows
    3. projection  - a sculpture whose shadow, not its body, is the image
  One HTML file plus a self-hosted copy of three.js r178 (MIT, see vendor/three-LICENSE.txt).

import * as THREE from './vendor/three.module.min.js';

const $ = id => document.getElementById(id);
function t(key, vars) {
  const lang = (window.PreskerI18n && window.PreskerI18n.getResolved()) || 'en';
  const dict = (window.PRESKER_I18N && window.PRESKER_I18N[lang]) || {};
  const fallback = (window.PRESKER_I18N && window.PRESKER_I18N.en) || {};
  let s = dict[key] != null ? dict[key] : fallback[key] || '';
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);

}
const clamp01 = v => Math.max(0, Math.min(1, v));
const DEG = Math.PI / 180;
const wrap180 = a => ((a + 180) % 360 + 360) % 360 - 180;

// ---------- renderer, camera, room ----------
const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
const camera = new THREE.PerspectiveCamera(68, 1, 0.05, 80);
camera.rotation.order = 'YXZ';

const RW = 12, RD = 10, RH = 4.5;                 // the gallery: 12 m wide, 10 m deep, 4.5 m high
const wallMat = new THREE.MeshStandardMaterial({ color: 0xf2f1ec, roughness: 0.95 });
const floorMat = new THREE.MeshStandardMaterial({ color: 0xcfccc4, roughness: 0.85 });
function surface(w, h, mat, x, y, z, rx, ry) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.set(rx, ry, 0, 'YXZ');
  m.receiveShadow = true; scene.add(m);
  return m;
}
const room = {
  floor: surface(RW, RD, floorMat, 0, 0, 0, -Math.PI / 2, 0),
  ceiling: surface(RW, RD, wallMat, 0, RH, 0, Math.PI / 2, 0),
  back: surface(RW, RH, wallMat, 0, RH / 2, -RD / 2, 0, 0),
  front: surface(RW, RH, wallMat, 0, RH / 2, RD / 2, 0, Math.PI),
  left: surface(RD, RH, wallMat, -RW / 2, RH / 2, 0, 0, Math.PI / 2),
  right: surface(RD, RH, wallMat, RW / 2, RH / 2, 0, 0, -Math.PI / 2),
};

const ambient = new THREE.AmbientLight(0xffffff, 0.4);
const hemi = new THREE.HemisphereLight(0xffffff, 0x9a968c, 1.6);
scene.add(ambient, hemi);

// ---------- exercise 1: the anamorphic painting ----------
const VIEW = new THREE.Vector3(3.7, 1.6, 3.3);    // the one spot where the painting resolves
const VIEW_AT = new THREE.Vector3(-2.6, 1.25, -3.6);
const ex1 = new THREE.Group(); scene.add(ex1);
const ex1Boxes = [];
function block(group, w, h, d, x, z, mat = wallMat, list) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, h / 2, z); m.castShadow = m.receiveShadow = true;
  group.add(m); if (list) list.push(m);
  return m;
}
block(ex1, 0.6, RH, 0.6, 1.15, -0.35, wallMat, ex1Boxes);   // pillars and a plinth break the painting up
block(ex1, 0.5, RH, 0.5, -3.3, -1.6, wallMat, ex1Boxes);
block(ex1, 1.0, 0.9, 1.0, 2.4, -2.5, wallMat, ex1Boxes);
block(ex1, 0.8, 1.6, 0.8, -1.0, 1.2, wallMat, ex1Boxes);

// depth map seen from the viewpoint = which surfaces the "projector" can reach
const vcam = new THREE.PerspectiveCamera(62, 1, 0.1, 30);
const depthRT = new THREE.WebGLRenderTarget(1024, 1024, { depthTexture: new THREE.DepthTexture(1024, 1024) });
const paintUniforms = {
  uV: { value: VIEW.clone() }, uR: { value: new THREE.Vector3() }, uU: { value: new THREE.Vector3() }, uF: { value: new THREE.Vector3() },
  uVP: { value: new THREE.Matrix4() }, uDepth: { value: depthRT.depthTexture },
  uNear: { value: vcam.near }, uFar: { value: vcam.far }, uColor: { value: new THREE.Color(0xe5322b) },
};
const paintMat = new THREE.ShaderMaterial({
  uniforms: paintUniforms,
  polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
  vertexShader: `varying vec3 vW;
    void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform vec3 uV, uR, uU, uF, uColor; uniform mat4 uVP; uniform sampler2D uDepth; uniform float uNear, uFar;
    varying vec3 vW;
    void main(){
      vec3 d = vW - uV; float z = dot(d, uF);
      if (z <= 0.05) discard;
      vec2 p = vec2(dot(d, uR), dot(d, uU)) / z;            // where this point lands in the viewer's picture
      float r = length(p); vec2 a = abs(p); float m = max(a.x, a.y);
      bool ring = r > 0.300 && r < 0.352;
      bool square = m > 0.140 && m < 0.182;
      bool bar = a.y < 0.022 && a.x > 0.182 && a.x < 0.300;   // two arms joining square and circle
      if (!(ring || square || bar)) discard;
      vec4 c = uVP * vec4(vW, 1.0); vec3 n = c.xyz / c.w;
      if (abs(n.x) > 1.0 || abs(n.y) > 1.0) discard;
      float sd = texture2D(uDepth, n.xy * 0.5 + 0.5).x;

  const rows = EX.slice(0, 3).map((x, i) => {
    const g = predictions[i];
    const mark = g == null ? t('wcDashMark') : g === x.predict.correct ? t('wcPredictedMark') : t('wcSurprisedMark');
    return `<tr><td>${i + 1}. ${x.title}</td><td>${x.debrief.takeaway}</td><td style="white-space:nowrap">${mark}</td></tr>`;
  }).join('');
  openModal(`<div class="eyebrow">White Cube</div><h2>${t('wcSummaryH2')}</h2>
    <table class="summary">${rows}</table>
    <p>${t('wcSummaryP')}</p>
    <p class="small">${t('wcSummarySmall')}</p>
    <div class="actions"><button onclick="location.href='/lab/white-cube-notes.html'">${t('wcNotesBtn')}</button>
      <button class="go" id="goStudio">${t('wcOpenStudio')}</button></div>${FOOTER()}`);
  $('goStudio').addEventListener('click', () => start(3, false));
}

$('btnHelp').addEventListener('click', showHelp);
$('btnCollapse').addEventListener('click', () => { const m = $('hud').classList.toggle('min'); $('btnCollapse').textContent = m ? '+' : '–'; });

// ---------- per-frame logic ----------
const pillarsXZ = ex1Boxes.map(b => ({ x: b.position.x, z: b.position.z, hx: b.geometry.parameters.width / 2 + 0.28, hz: b.geometry.parameters.depth / 2 + 0.28 }));
const viewDir = VIEW_AT.clone().sub(VIEW).normalize();
const look = new THREE.Vector3();

function walk(dt) {
  const sp = 2.4 * dt;
  const fx = -Math.sin(fp.yaw), fz = -Math.cos(fp.yaw);
  let mx = 0, mz = 0;
  if (move.f) { mx += fx; mz += fz; } if (move.b) { mx -= fx; mz -= fz; }
  if (move.l) { mx += fz; mz -= fx; } if (move.r) { mx -= fz; mz += fx; }
  const L = Math.hypot(mx, mz); if (L) { fp.x += mx / L * sp; fp.z += mz / L * sp; }
  fp.x = Math.max(-RW / 2 + 0.3, Math.min(RW / 2 - 0.3, fp.x));
  fp.z = Math.max(-RD / 2 + 0.3, Math.min(RD / 2 - 0.3, fp.z));
  for (const p of pillarsXZ) {         // slide out of pillars along the shallower side
    const dx = fp.x - p.x, dz = fp.z - p.z;
    if (Math.abs(dx) < p.hx && Math.abs(dz) < p.hz) {
      if (p.hx - Math.abs(dx) < p.hz - Math.abs(dz)) fp.x = p.x + Math.sign(dx || 1) * p.hx; else fp.z = p.z + Math.sign(dz || 1) * p.hz;
    }
  }
}

function tick(dt) {
  clock += mode === 'play' ? dt : 0;
  let progress = 0, note = '', label = '';

  if (ei === 0) {
    if (mode === 'play' || mode === 'explore') walk(dt);
    camera.position.set(fp.x, 1.6, fp.z);
    camera.rotation.set(fp.pitch, fp.yaw, 0);
    camera.getWorldDirection(look);
    const dist = Math.hypot(fp.x - VIEW.x, fp.z - VIEW.z);
    const ang = Math.acos(Math.max(-1, Math.min(1, look.dot(viewDir)))) / DEG;
    progress = 0.7 * clamp01(1 - dist / 7) ** 1.5 + 0.3 * clamp01(1 - ang / 50);
    label = dist < 0.6 && ang > 12 ? t('wcRightSpotLook') : t('wcAlignedPct', { pct: Math.round(progress * 100) });
    if (dist < 0.6 && ang > 12) note = t('wcStandingNote');
    if (mode === 'play' && dist < 0.33 && ang < 7) { winHold += dt; if (winHold > 0.35) showDebrief(); } else winHold = 0;
  } else {
    // orbit camera looking into the room through the missing front wall
    const target = new THREE.Vector3(STAGE.x, 1.2, STAGE.z - 0.8);
    const d = orb.dist * orb.zoom * (innerWidth < innerHeight ? 1.35 : 1);
    camera.position.set(target.x + Math.sin(orb.az) * Math.cos(orb.el) * d, target.y + Math.sin(orb.el) * d, target.z + Math.cos(orb.az) * Math.cos(orb.el) * d);
    camera.lookAt(target);
  }

  if (ei === 1) {
    const on = lamps.filter(L => L.on);
    let minSep = 999;
    for (let a = 0; a < 3; a++) for (let b = a + 1; b < 3; b++) minSep = Math.min(minSep, Math.abs(lamps[a].az - lamps[b].az));
    progress = on.length / 3 * 0.55 + (on.length === 3 ? 0.45 * clamp01(minSep / 22) : 0);
    label = t('wcLampsOnLabel', { n: on.length });
    if (on.length === 1) note = t('wcOneLampNote');
    else if (on.length === 2) note = t('wcTwoLampNote');
    else if (minSep < 22) note = t('wcThreeLampCloseNote');
    if (mode === 'play' && on.length === 3 && minSep >= 22) { winHold += dt; if (winHold > 0.6) showDebrief(); } else winHold = 0;
  }

  if (ei >= 2) {
    if (turnHeld && (mode === 'play' || mode === 'explore')) {
      sculptYaw = (sculptYaw + turnHeld * dt * (pointers.size ? 12 : 12)) % 360;
      const r = $('dock').querySelector('.panel')?._range; if (r) r.value = ((sculptYaw % 360) + 360) % 360;
    }
    sculpture.rotation.y = sculptYaw * DEG;
  }
  if (ei === 2) {
    const err = Math.abs(wrap180(sculptYaw - TARGET_YAW));
    const mirrorErr = Math.abs(wrap180(sculptYaw - TARGET_YAW - 180));
    progress = clamp01(1 - err / 90) ** 2;
    label = err < 1.5 ? t('wcSharpLabel') : err < 10 ? t('wcAlmostLabel') : '';
    if (mirrorErr < 4) note = t('wcMirroredNote');
    else if (err < 12 && err >= 2.5) note = t('wcFineTuneNote');
    if (mode === 'play' && err < 2.5) { winHold += dt; if (winHold > 0.5) showDebrief(); } else winHold = 0;
  }

  if (mode === 'play' && ei < 3 && !hintShown && clock > 40) {
    hintShown = true; $('mHint').hidden = false; $('mHint').textContent = t('wcHintPrefix', { hint: EX[ei].hint });
    if (ei === 0) steps.visible = true;
  }
  return { progress, note, label };
}

let last = performance.now(), uiClock = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const st = tick(dt);
  uiClock += dt;
  if (uiClock > 0.1) {
    uiClock = 0;
    $('mBar').style.width = st.progress * 100 + '%';
    $('mProg').textContent = st.label;
    $('mNote').textContent = mode === 'play' ? st.note : '';
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.fov = innerWidth < innerHeight ? 78 : 62;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

window.__wc = { start, get ei() { return ei; }, get mode() { return mode; }, lamps, placeLamp, setLamp, fp, VIEW, VIEW_AT, TARGET_YAW,
  set yaw(v) { sculptYaw = v; }, renderer, scene, camera, blocks: () => sculptureBlocks };

// ---------- re-render JS-built UI (HUD, dock, open modal) on language switch ----------
// Static data-i18n elements are retranslated by i18n.js itself; everything the game
// builds with textContent/innerHTML has to be redrawn here instead.
document.addEventListener('presker-lang-change', () => {
  EX = buildEX();
  renderChips();
  buildDock();
  if (mode === 'intro') showIntro();
  else if (mode === 'help') showHelp();
  else if (mode === 'predict') showPredict();
  else if (mode === 'debrief') showDebrief();
  else if (mode === 'summary') showSummary();
  else {
    $('mTitle').textContent = (ei < 3 ? `${t('wcExerciseWord')} ${ei + 1} · ` : '') + EX[ei].title;
    $('mGoal').textContent = EX[ei].goal;
    $('mPred').textContent = predictions[ei] != null ? t('wcYourPrediction', { opt: EX[ei].predict.options[predictions[ei]] }) : '';
    if (hintShown) $('mHint').textContent = t('wcHintPrefix', { hint: EX[ei].hint });
  }
});

start(0, false);
showIntro();
requestAnimationFrame(frame);
</script>
</body>
</html>
