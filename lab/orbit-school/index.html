<!--
  Orbit School - a predict / observe / explain game about orbital mechanics.
  One HTML file plus a self-hosted copy of three.js r178 (MIT, see vendor/three-LICENSE.txt).
  Physics: point-mass gravity, GM = 1, planet radius = 1, symplectic Euler with small substeps.
  The orange orbit line is computed analytically from the current position and velocity
  (Kepler elements), so it answers "what happens if I coast from here?" in real time.
-->
<style>
:root {
  --bg: #0e0e0e; --panel: rgba(16,16,16,.82); --solid: #141414; --ink: #e8e8e8; --muted: #8a8a8a;
  --line: #262626; --accent: #b8f57a; --orbit: #ffb547; --danger: #ff6b5b; --sky: #6cc4ff;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
a { color: var(--accent); }
button { font: inherit; color: var(--ink); background: var(--solid); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: #444; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on { border-color: var(--accent); color: var(--accent); }

.top { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between;
  align-items: flex-start; gap: 12px; pointer-events: none; }
.top > * { pointer-events: auto; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.hud-left { width: 340px; max-width: 100%; }
.home { font: 12px var(--mono); color: var(--muted); text-decoration: none; }
.home:hover { color: var(--accent); }
.pill-group { display: flex; align-items: center; gap: 2px; background: var(--solid); border: 1px solid var(--line); border-radius: 7px; padding: 2px; margin-top: 6px; width: fit-content; }
.pill-btn { font: 11px var(--mono); border: none; background: transparent; color: var(--muted); padding: 5px 8px; border-radius: 5px; cursor: pointer; line-height: 1; }
.pill-btn:hover { color: var(--ink); }
.pill-btn.on { border: 1px solid var(--accent); color: var(--accent); font-weight: 700; }
h1 { font: 700 18px var(--mono); margin: 4px 0 8px; letter-spacing: -.01em; }
.chips { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.chip { font: 12px var(--mono); padding: 3px 9px; border-radius: 999px; }
.chip.cur { border-color: var(--accent); color: var(--accent); }
.chip.done::after { content: " ✓"; color: var(--accent); }
.m-title { font: 600 15px var(--mono); }
.m-goal { color: #cfcfcf; margin: 4px 0 8px; }
.m-progress { display: flex; align-items: center; gap: 10px; font: 12px var(--mono); color: var(--muted); }
.bar { flex: 1; height: 6px; background: #222; border-radius: 3px; overflow: hidden; min-width: 60px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.m-note { font-size: 12.5px; margin-top: 8px; color: var(--orbit); }
.m-note:empty { display: none; }
.m-pred { font-size: 12px; color: var(--muted); margin-top: 8px; }
.m-pred:empty { display: none; }
.m-hint { font-size: 12.5px; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: #1b2412; color: #d9f5bd; }
.m-links { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  font: 12px var(--mono); }
.m-links a { text-decoration: none; }
.collapse { display: none; padding: 2px 8px; font-size: 12px; }

.tele { font: 12.5px var(--mono); min-width: 210px; }
.tele .row { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; }
.tele .row[hidden] { display: none; }
.tele .k { color: var(--muted); }
.tele .v { font-variant-numeric: tabular-nums; }
.tele .fuel { margin-top: 6px; }
.tele .fuel .bar i { background: var(--sky); }

.controls { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(640px, calc(100% - 24px)); }
.thrust { display: grid; grid-template-columns: 1fr .8fr .8fr 1fr; gap: 8px; width: 100%; }
.hold { padding: 12px 8px; font: 600 14px var(--mono); user-select: none; -webkit-user-select: none;
  touch-action: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--panel); backdrop-filter: blur(6px); }
.hold small { font-weight: 400; color: var(--muted); font-size: 11px; }
.hold.fwd { border-color: #3c5426; }
.hold.active { background: #2a3a18; border-color: var(--accent); color: var(--accent); }
.hold.side { font-size: 12.5px; }
.timebar { display: flex; gap: 6px; align-items: center; font: 12px var(--mono); flex-wrap: wrap; justify-content: center; }
.timebar button { padding: 5px 10px; font: 12px var(--mono); background: var(--panel); }
.legend { position: fixed; left: 14px; bottom: 14px; font: 11.5px var(--mono); color: var(--muted); line-height: 1.7; pointer-events: none; }
.legend b { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center;
  justify-content: center; padding: 16px; z-index: 10; }
.modal[hidden] { display: none; }
.card { background: var(--solid); border: 1px solid var(--line); border-radius: 14px; padding: 22px 22px 18px;
  width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.card .eyebrow { font: 12px var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
.card h2 { font: 700 20px var(--mono); margin: 6px 0 10px; }
.card p { margin: 0 0 12px; color: #d6d6d6; }
.card .opts { display: grid; gap: 8px; margin: 14px 0 6px; }
.card .opts button { text-align: left; padding: 12px 14px; font-size: 14.5px; }
.card .opts button:hover { border-color: var(--accent); }
.card .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.card .actions .go { background: var(--accent); color: #0e0e0e; border-color: var(--accent); font-weight: 700; }
.verdict { padding: 10px 12px; border-radius: 10px; margin: 0 0 12px; font-size: 14px; }
.verdict.yes { background: #1b2412; color: #d9f5bd; }
.verdict.no { background: #2a1d0c; color: #ffd9a3; }
.takeaway { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin: 0 0 12px; font: 600 14px var(--mono); }
.reflect { background: #181818; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 4px; }
.reflect .q { font-weight: 600; }
.reflect .a { margin-top: 6px; color: #cfcfcf; }
.reflect button { margin-top: 8px; font-size: 12.5px; padding: 5px 10px; }
.small { font-size: 12.5px; color: var(--muted); }
.keys { font: 12px var(--mono); color: var(--muted); line-height: 1.8; }
kbd { font: 11px var(--mono); border: 1px solid #333; border-radius: 4px; padding: 0 5px; color: #ccc; }
.summary { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 6px 0 12px; }
.summary td { padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.site-foot { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); display: flex;
  flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; font: 12px var(--mono); color: var(--muted); }
.donate { display: inline-flex; align-items: center; gap: 7px; background: #181818; border: 1px solid var(--line);
  color: var(--muted); font-size: 12px; padding: 6px 13px; border-radius: 999px; text-decoration: none; }
.donate:hover { color: var(--ink); border-color: #3a3a3a; }
.donate .r { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px;
  border-radius: 50%; background: #fff; color: #000; font-size: 10px; font-weight: 700; }

@media (max-width: 760px) {
  .top { flex-direction: column; top: 8px; left: 8px; right: 8px; gap: 6px; }
  .hud-left, .tele { width: 100%; }
  .panel { padding: 9px 11px; }
  h1 { font-size: 15px; margin: 2px 0 6px; }
  .collapse { display: inline-block; }
  .hud-left.min .chips, .hud-left.min .m-goal, .hud-left.min .m-pred, .hud-left.min .m-links { display: none; }
  .tele { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; font-size: 11.5px; min-width: 0; }
  .tele .fuel { grid-column: span 2; margin-top: 2px; }
  .legend { display: none; }
  .controls { bottom: max(8px, env(safe-area-inset-bottom)); width: calc(100% - 16px); }
  .hold { padding: 12px 4px; font-size: 13px; }
  .hold small { display: none; }
}
</style>
</head>

<canvas id="scene"></canvas>

<div class="top">
  <div class="panel hud-left" id="hud">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">

  </div>

  </div>
</div>

<div class="legend">
  <div><b style="background:var(--orbit)"></b><span data-i18n="osLegendOrbit">your orbit if you stop firing</span></div>
  <div><b style="background:var(--accent)"></b><span data-i18n="osLegendDirection">direction of travel · target</span></div>
  <div><b style="background:#5a5a5a"></b><span data-i18n="osLegendTrail">where you have been</span></div>
</div>

<div class="controls">

    trailClock = 0; trail.push([S.x, S.y]);
    if (trail.length > TRAIL_N) trail.shift();
  }
  return null;
}

// ---------- camera: drag to orbit, wheel or pinch to zoom ----------
let camTheta = 0.9, camPhi = 1.0, camDist = 6, zoom = 1;
const pointers = new Map();
let pinch0 = 0, zoom0 = 1;
canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); zoom0 = zoom; } });
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 1) {
    camTheta -= (e.clientX - prev[0]) * 0.006;
    camPhi = Math.max(0.15, Math.min(1.5, camPhi - (e.clientY - prev[1]) * 0.006));
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    zoom = Math.max(0.3, Math.min(4, zoom0 * pinch0 / (Math.hypot(a[0] - b[0], a[1] - b[1]) || 1)));
  }
});
const endPointer = e => pointers.delete(e.pointerId);
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.max(0.3, Math.min(4, zoom * Math.exp(e.deltaY * 0.001))); }, { passive: false });

// ---------- input ----------
function setHeld(dir, on) {
  held[dir] = on;
  document.querySelector(`.hold[data-dir="${dir}"]`).classList.toggle('active', on);
}
for (const b of document.querySelectorAll('.hold')) {
  const dir = b.dataset.dir;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); setHeld(dir, true); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, () => setHeld(dir, false));
  b.addEventListener('contextmenu', e => e.preventDefault());
}
const KEYS = { w: 'pro', arrowup: 'pro', s: 'retro', arrowdown: 'retro', a: 'in', arrowleft: 'in', d: 'out', arrowright: 'out' };
addEventListener('keydown', e => {
  if (mode !== 'fly') return;
  const k = e.key.toLowerCase();
  if (KEYS[k]) { e.preventDefault(); setHeld(KEYS[k], true); }
  else if (k === 'shift') setFine(true);
  else if (k === '1') setWarp(1); else if (k === '2') setWarp(4); else if (k === '3') setWarp(16);
  else if (k === ' ') { e.preventDefault(); setWarp(warp ? 0 : 1); }
  else if (k === 'r') startMission(mi, false);
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (KEYS[k]) setHeld(KEYS[k], false);
  else if (k === 'shift') setFine(false);
});
addEventListener('blur', () => { for (const d in held) setHeld(d, false); });

function setWarp(w) {
  warp = w;
  for (const b of document.querySelectorAll('[data-warp]')) b.classList.toggle('on', +b.dataset.warp === w);
}
function setFine(on) { fine = on; $('btnFine').classList.toggle('on', on); }
for (const b of document.querySelectorAll('[data-warp]')) b.addEventListener('click', () => setWarp(+b.dataset.warp));
$('btnFine').addEventListener('click', () => setFine(!fine));
$('btnRetry').addEventListener('click', () => startMission(mi, false));
$('btnHelp').addEventListener('click', () => showHelp());
$('btnCollapse').addEventListener('click', () => {
  const min = $('hud').classList.toggle('min');
  $('btnCollapse').textContent = min ? '+' : '–';
});

// ---------- missions flow ----------
function renderChips() {
  const host = $('chips'); host.innerHTML = '';
  MISSIONS.forEach((m, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === mi ? ' cur' : '') + (done.has(i) ? ' done' : '');
    b.textContent = i < 4 ? String(i + 1) : t('osFree');
    b.title = t(m.titleKey);
    b.addEventListener('click', () => startMission(i, true));
    host.appendChild(b);
  });
}

function startMission(i, ask) {
  mi = i; mission = MISSIONS[i];
  const set = mission.setup();
  S = { ...set.ship };
  ST = set.station ? { ...set.station } : null;
  ring = set.ring || 0;
  used = 0; budget = mission.budget / KMS; trail.length = 0;   // budgets are written in km/s flyClock = 0; hintShown = false;
  gap0 = ST ? Math.hypot(S.x - ST.x, S.y - ST.y) : 1;
  for (const d in held) setHeld(d, false);
  setFine(false);
  $('mTitle').textContent = (i < 4 ? t('osMissionPrefix', { n: i + 1 }) : '') + t(mission.titleKey);
  $('mGoal').textContent = t(mission.goalKey);
  $('mHint').hidden = true;
  $('rowGap').hidden = !ST || i === 4;
  const pred = predictions[i];
  $('mPred').textContent = pred != null ? t('osYourPrediction', { opt: t(mission.predict.optionKeys[pred]) }) : '';
  renderChips();
  if (ask && mission.predict && predictions[i] == null) { showPredict(); }
  else { closeModal(); mode = 'fly'; setWarp(1); }
}

function openModal(html) {
  $('card').innerHTML = html;
  $('modal').hidden = false;
  setWarp(0);
  const first = $('card').querySelector('.go, .opts button, button');
  if (first) first.focus({ preventScroll: true });
}
function closeModal() { $('modal').hidden = true; }

const FOOTER = () => `<div class="site-foot"><span>${t('osFooter')}</span>
  <a href="https://revolut.me/mihadxmro" target="_blank" rel="noopener" class="donate"><span class="r">R</span> Donate via Revolut</a></div>`;

function showIntro() {
  mode = 'intro';
  openModal(`<div class="eyebrow">Orbit School</div>
    <h2>${t('osIntroH2')}</h2>
    <p>${t('osIntroP1')}</p>
    <p>${t('osIntroP2')}</p>
    <p class="small">${t('osIntroP3')}</p>
    <div class="keys">${t('osIntroKeys')}</div>
    <div class="actions"><button onclick="location.href='/lab/orbit-school-notes.html'">${t('osTeacherNotes')}</button>
      <button class="go" id="goStart">${t('osStartMission1')}</button></div>${FOOTER()}`);
  $('goStart').addEventListener('click', () => startMission(0, true));
}

function showHelp() {
  const wasFly = mode === 'fly';
  openModal(`<div class="eyebrow">${t('osControls')}</div><h2>${t('osHelpH2')}</h2>
    <p>${t('osHelpP1')}</p>
    <p>${t('osHelpP2')}</p>
    <div class="keys">${t('osHelpKeys')}</div>
    <div class="actions"><button class="go" id="goBack">${t('osBackToFlying')}</button></div>`);
  $('goBack').addEventListener('click', () => { closeModal(); if (wasFly) setWarp(1); });
}

function showPredict() {
  mode = 'predict';
  const p = mission.predict;
  openModal(`<div class="eyebrow">${t('osPredictEyebrow', { n: mi + 1 })}</div>
    <h2>${t(mission.titleKey)}</h2>
    <p>${t(p.qKey)}</p>
    <div class="opts">${p.optionKeys.map((k, i) => `<button data-k="${i}">${t(k)}</button>`).join('')}</div>
    <p class="small">${t('osPredictSmall')}</p>`);
  for (const b of $('card').querySelectorAll('.opts button')) b.addEventListener('click', () => {
    predictions[mi] = +b.dataset.k;
    $('mPred').textContent = t('osYourPrediction', { opt: t(p.optionKeys[predictions[mi]]) });
    closeModal(); mode = 'fly'; setWarp(1);
  });
}

function showDebrief() {
  mode = 'debrief';
  done.add(mi);
  try { localStorage.setItem('orbit-school-done', JSON.stringify([...done])); } catch (_) {}
  renderChips();
  const p = mission.predict, d = mission.debrief, guess = predictions[mi];
  const right = guess === p.correct;
  const verdict = guess == null ? '' : right
    ? `<div class="verdict yes">${t('osVerdictYes', { opt: t(p.optionKeys[guess]) })}</div>`
    : `<div class="verdict no">${t('osVerdictNo', { opt: t(p.optionKeys[guess]), correct: t(p.optionKeys[p.correct]) })}</div>`;
  const eff = isFinite(budget) ? `<p class="small">${t('osEffUsed', { used: (used * KMS).toFixed(2), ideal: mission.ideal.toFixed(2), nicely: used * KMS <= mission.ideal * 1.1 ? t('osNicelyDone') : '' })}</p>` : '';
  const next = mi < 3 ? t('osMissionN', { n: mi + 2 }) : t('osWrapUp');
  openModal(`<div class="eyebrow">${t('osMissionComplete', { n: mi + 1 })}</div>
    <h2>${t(mission.titleKey)}</h2>${verdict}
    <div class="takeaway">${t(d.takeawayKey)}</div>
    <p>${t(d.textKey)}</p>${eff}
    <div class="reflect"><div class="q">${t('osThinkAbout', { q: t(d.qKey) })}</div>
      <div class="a" hidden>${t(d.aKey)}</div><button id="goReveal">${t('osShowAnswer')}</button></div>
    <div class="actions"><button id="goAgain">${t('osFlyAgain')}</button><button class="go" id="goNext">${next}</button></div>`);
  $('goReveal').addEventListener('click', e => { $('card').querySelector('.reflect .a').hidden = false; e.target.remove(); });
  $('goAgain').addEventListener('click', () => startMission(mi, false));
  $('goNext').addEventListener('click', () => mi < 3 ? startMission(mi + 1, true) : showSummary());
}

function showCrash() {
  mode = 'crash';
  openModal(`<div class="eyebrow">${mi < 4 ? t('osMissionN', { n: mi + 1 }) : t('osM4Title')}</div><h2>${t('osCrashH2')}</h2>
    <p>${t('osCrashP')}</p>
    <div class="actions"><button class="go" id="goRetry">${t('osTryAgain')}</button></div>`);
  $('goRetry').addEventListener('click', () => startMission(mi, false));
}

function showSummary() {
  mode = 'summary';
  const rows = MISSIONS.slice(0, 4).map((m, i) => {
    const g = predictions[i];
    const res = g == null ? '–' : g === m.predict.correct ? t('osPredictedMark') : t('osSurprisedMark');
    return `<tr><td>${i + 1}. ${t(m.titleKey)}</td><td>${t(m.debrief.takeawayKey)}</td><td style="white-space:nowrap">${res}</td></tr>`;
  }).join('');
  const surprised = MISSIONS.slice(0, 4).filter((m, i) => predictions[i] != null && predictions[i] !== m.predict.correct).length;
  openModal(`<div class="eyebrow">Orbit School</div><h2>${t('osSummaryH2')}</h2>
    <table class="summary">${rows}</table>
    <p>${surprised ? t('osSummarySurprised', { n: surprised }) : t('osSummaryAllCorrect')}</p>
    <p class="small">${t('osTryFreeFlight')}</p>
    <div class="actions"><button onclick="location.href='/lab/orbit-school-notes.html'">${t('osHowTeaches').replace(' →', '')}</button>
      <button class="go" id="goFree">${t('osFreeFlightBtn')}</button></div>${FOOTER()}`);
  $('goFree').addEventListener('click', () => startMission(4, false));
}

// ---------- frame loop ----------
const v3 = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
const toW = (x, y, h = 0) => v3.set(x, h, y);
let last = performance.now(), uiClock = 0, el = null;

function frame(now) {
  const dtReal = Math.min(0.05, (now - last) / 1000); last = now;
  const dtSim = mode === 'fly' ? dtReal * RATE * warp : 0;

  if (dtSim > 0) {
    const r = simulate(dtSim);
    flyClock += dtReal;
    if (r === 'crash') showCrash();
  }
  el = elements(S.x, S.y, S.vx, S.vy);
  const s = { ...el, gap: ST ? Math.hypot(S.x - ST.x, S.y - ST.y) : Infinity, gap0 };
  if (mode === 'fly' && mission.check(s)) showDebrief();
  if (mode === 'fly' && !hintShown && mission.hintKey && (flyClock > 30 || used >= budget - 1e-6)) {
    hintShown = true; $('mHint').hidden = false; $('mHint').textContent = t('osHintPrefix', { hint: t(mission.hintKey) });
  }

  planet.rotation.y += dtSim * 0.06; clouds.rotation.y += dtSim * 0.075;

  // camera fits the orbit unless the player zoomed
  const reach = Math.max(el.r, Math.min(isFinite(el.ra) ? el.ra : el.r * 1.6, 8), ring, ST ? Math.hypot(ST.x, ST.y) : 0);
  const aspect = innerWidth / innerHeight;
  const want = (reach * 3.1 + 0.6) * (aspect < 1 ? 1.25 / aspect : 1) * zoom;
  camDist += (want - camDist) * Math.min(1, dtReal * 2.5);
  camera.position.set(camDist * Math.cos(camPhi) * Math.cos(camTheta), camDist * Math.sin(camPhi), camDist * Math.cos(camPhi) * Math.sin(camTheta));
  camera.lookAt(0, aspect < 1 ? -camDist * 0.08 : 0, 0);
  const W = camDist * 0.0035, size = camDist * 0.016;

  // orbit, ring, trail
  const o = conicInto(orbitLine, el);
  orbitLine.mat.color.set(el.rp < 1 ? 0xff6b5b : 0xffb547);
  orbitLine.update(o.n, W, o.closed);
  ringLine.mesh.visible = !!ring;
  if (ring) ringLine.update(circleInto(ringLine, ring), W * 0.8, true, 6);
  stationLine.mesh.visible = !!ST;
  if (ST) { const so = conicInto(stationLine, elements(ST.x, ST.y, ST.vx, ST.vy)); stationLine.update(so.n, W * 0.6, so.closed); }
  for (let i = 0; i < trail.length; i++) { trailLine.pts[2 * i] = trail[i][0]; trailLine.pts[2 * i + 1] = trail[i][1]; }
  trailLine.mesh.visible = trail.length > 1;
  if (trail.length > 1) trailLine.update(trail.length, W * 0.7);

  // AP / PE markers along the eccentricity vector
  const showAp = el.e > 0.02 && el.e < 1 && el.ra < 40, showPe = el.e > 0.02;
  for (const [m, l, r, ang, vis] of [[apDot, apLabel, el.ra, el.w + Math.PI, showAp], [peDot, peLabel, el.rp, el.w, showPe]]) {
    m.visible = l.visible = vis;
    if (!vis) continue;
    m.position.copy(toW(r * Math.cos(ang), r * Math.sin(ang), 0.004)); m.scale.setScalar(size * 0.18);
    l.position.copy(m.position);
  }

  // ship, flame, velocity arrow
  ship.position.copy(toW(S.x, S.y));
  ship.scale.setScalar(size);
  const vdir = new THREE.Vector3(S.vx, 0, S.vy).normalize();
  ship.quaternion.setFromUnitVectors(up, vdir);
  const td = budget - used > 0 && mode === 'fly' ? thrustDir(S) : null;
  flame.visible = !!td;
  if (td) {
    const back = new THREE.Vector3(-td[0], 0, -td[1]);
    flame.quaternion.setFromUnitVectors(up, back);
    flame.position.copy(ship.position).addScaledVector(back, size * 0.55);
    flame.scale.set(size * 1.1, size * (1.2 + Math.random() * 0.5), size * 1.1);
  }
  velArrow.position.copy(ship.position);
  velArrow.setDirection(vdir);
  velArrow.setLength(size * 4.5, size * 1.2, size * 0.7);

  station.visible = stationLabel.visible = !!ST;
  if (ST) {
    station.position.copy(toW(ST.x, ST.y)); station.scale.setScalar(size * 0.9);
    station.rotation.y += dtSim * 0.8;
    stationLabel.position.copy(station.position);
  }

  // telemetry (a few times a second is plenty)
  uiClock += dtReal;
  if (uiClock > 0.08) {
    uiClock = 0;
    $('tSpeed').textContent = kms(el.v);
    $('tAlt').textContent = altKm(el.r);
    $('tAp').textContent = el.e >= 1 ? t('osEscaping') : altKm(el.ra);
    $('tPe').textContent = el.rp < 1 ? t('osBelowSurface') : altKm(el.rp);
    $('tPe').style.color = el.rp < 1 ? 'var(--danger)' : '';
    if (ST) $('tGap').textContent = fmtKm(s.gap);
    const left = budget - used;
    $('tFuel').textContent = isFinite(budget) ? (left * KMS).toFixed(2) + ' km/s' : t('osUnlimited');
    $('fuelBar').style.width = (isFinite(budget) ? clamp01(left / budget) : 1) * 100 + '%';
    const [pr, txt] = mission.progress(s);
    $('mBar').style.width = pr * 100 + '%';
    $('mBar').parentElement.style.visibility = mi === 4 ? 'hidden' : '';
    $('mProg').textContent = txt;
    $('mNote').textContent = mode === 'fly' ? mission.note(s, held) : '';
  }

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

updateAriaLabels();
startMission(0, false);
mode = 'intro';
showIntro();
requestAnimationFrame(frame);
</script>
</body>
</html>
